<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Tea Timer interface preview</title>
  <desc id="desc">A compact tea timer README hero showing the mobile timer interface, brewing progress, cooling overtime, and brew counter.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111211"/>
      <stop offset="0.58" stop-color="#151815"/>
      <stop offset="1" stop-color="#0b100d"/>
    </linearGradient>
    <linearGradient id="greenGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#88d982" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#2e7d32" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="coolingGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#88d982"/>
      <stop offset="1" stop-color="#e87575"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#020302" flood-opacity="0.34"/>
    </filter>
  </defs>

  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <path d="M 0 338 C 180 308 280 354 418 330 C 584 300 672 252 840 286 C 970 312 1065 340 1200 300 L 1200 420 L 0 420 Z" fill="#0f2513" opacity="0.34"/>
  <path d="M 92 80 H 486 M 92 128 H 400 M 92 176 H 454" stroke="#263025" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>

  <g id="title-block" transform="translate(72 72)">
    <text x="0" y="0" fill="#92988f" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="18" font-weight="650" letter-spacing="4">BREWING TIMER</text>
    <text x="0" y="68" fill="#e5e7e4" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="64" font-weight="650">Tea Timer</text>
    <text x="0" y="112" fill="#c0c8bd" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="25">Set the brew. Hear the finish.</text>
    <text x="0" y="146" fill="#c0c8bd" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="25">Track cooling overtime in red.</text>

    <g transform="translate(0 202)">
      <rect x="0" y="0" width="154" height="44" rx="22" fill="#1d1f1d" stroke="#353a34"/>
      <circle cx="24" cy="22" r="7" fill="#88d982"/>
      <text x="44" y="29" fill="#d8dfd5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18">BREWING</text>

      <rect x="172" y="0" width="150" height="44" rx="22" fill="#1d1f1d" stroke="#353a34"/>
      <circle cx="196" cy="22" r="7" fill="#e87575"/>
      <text x="216" y="29" fill="#d8dfd5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18">COOLING</text>
    </g>
  </g>

  <g id="phone-preview" transform="translate(688 34)" filter="url(#softShadow)">
    <rect x="0" y="0" width="332" height="352" rx="30" fill="#111211" stroke="#353a34" stroke-width="2"/>
    <text x="94" y="42" fill="#c0c8bd" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="18" font-weight="300" letter-spacing="8">tea</text>
    <text x="164" y="48" text-anchor="middle" fill="#88d982" font-family="Georgia,serif" font-size="42">&#33590;</text>
    <text x="208" y="42" fill="#c0c8bd" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="18" font-weight="300" letter-spacing="8">timer</text>

    <g transform="translate(48 78)">
      <text x="44" y="82" text-anchor="middle" fill="#e5e7e4" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="62" font-weight="350">00</text>
      <text x="118" y="77" text-anchor="middle" fill="#c0c8bd" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="48" font-weight="300">:</text>
      <text x="190" y="82" text-anchor="middle" fill="#e5e7e4" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="62" font-weight="350">10</text>
      <text x="44" y="116" text-anchor="middle" fill="#92988f" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="14" font-weight="520">Минуты</text>
      <text x="190" y="116" text-anchor="middle" fill="#92988f" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="14" font-weight="520">Секунды</text>
    </g>

    <g transform="translate(34 216)">
      <rect x="0" y="0" width="78" height="44" rx="10" fill="#1d1f1d" stroke="#353a34"/>
      <text x="39" y="29" text-anchor="middle" fill="#e5e7e4" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="18" font-weight="520">Stop</text>
      <rect x="92" y="0" width="172" height="44" rx="10" fill="#2e7d32" stroke="#2e7d32"/>
      <text x="178" y="29" text-anchor="middle" fill="#eaffea" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="18" font-weight="560">Start</text>
    </g>

    <g transform="translate(34 286)">
      <rect x="0" y="0" width="264" height="54" rx="12" fill="url(#greenGlow)" stroke="#88d982" stroke-width="2"/>
      <path d="M 132 1 H 252 Q 263 1 263 12 V 42 Q 263 53 252 53 H 12 Q 1 53 1 42 V 12 Q 1 1 12 1 H 132" fill="none" stroke="#88d982" stroke-width="3" stroke-linecap="round" stroke-dasharray="420 420" stroke-dashoffset="94"/>
      <text x="132" y="39" text-anchor="middle" fill="#88d982" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="42" font-weight="500">00:07</text>
    </g>
  </g>

  <g id="phase-strip" transform="translate(72 330)">
    <rect x="0" y="0" width="474" height="46" rx="23" fill="#1d1f1d" stroke="#353a34"/>
    <path d="M 24 23 H 180" stroke="#88d982" stroke-width="4" stroke-linecap="round"/>
    <path d="M 180 23 H 328" stroke="url(#coolingGlow)" stroke-width="4" stroke-linecap="round"/>
    <circle cx="24" cy="23" r="8" fill="#88d982"/>
    <circle cx="180" cy="23" r="8" fill="#88d982"/>
    <circle cx="328" cy="23" r="8" fill="#e87575"/>
    <text x="48" y="30" fill="#d8dfd5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="17">START</text>
    <text x="204" y="30" fill="#d8dfd5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="17">ZERO</text>
    <text x="352" y="30" fill="#d8dfd5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="17">-00:01</text>
  </g>

  <g id="brew-counter-chip" transform="translate(808 334)">
    <rect x="0" y="0" width="296" height="46" rx="14" fill="#1d1f1d" stroke="#353a34"/>
    <text x="148" y="30" text-anchor="middle" fill="#c0c8bd" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="20" font-weight="520">Сделан <tspan fill="#88d982" font-size="25">1</tspan> пролив.</text>
  </g>
</svg>
